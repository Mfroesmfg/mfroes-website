# Netlify build settings for the MFroes site.
# No build step is needed — the site is plain HTML.
[build]
  publish = "."
  command = ""

# Always serve the freshest content files (so admin edits show up right away)
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Old-website URL cleanup ---------------------------------------------
# The previous mfroesmfg.com site had pages like /categories/seed-cleaning
# that Google still lists. Those addresses no longer exist on the new site,
# so send anyone who lands on them (visitors AND Google) to the homepage
# instead of a "Page not found." 301 = permanent, which tells Google to
# replace the old link with the new site. These paths are not used by the
# current site, so /admin, /images, /content and real files are untouched.
[[redirects]]
  from = "/categories/seed-cleaning"
  to = "/seed-cleaners/"
  status = 301

[[redirects]]
  from = "/categories/seed-cleaning/"
  to = "/seed-cleaners/"
  status = 301

[[redirects]]
  from = "/categories/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/collections/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/products/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/product/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/pages/*"
  to = "/"
  status = 301

# Map important legacy top-level URLs to the closest current destination.
[[redirects]]
  from = "/equipment"
  to = "/#products"
  status = 301

[[redirects]]
  from = "/contact-us"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/about"
  to = "/#story"
  status = 301
